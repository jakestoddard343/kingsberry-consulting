<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Kingsberry lingonberry mark">
  <defs>
    <linearGradient id="lg-violet-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bff7e4"/>
      <stop offset="100%" stop-color="#22c39a"/>
    </linearGradient>
    <radialGradient id="sph-violet-lg-0" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="34%" stop-color="#b6a8ff"/>
      <stop offset="76%" stop-color="#6a4fd8"/>
      <stop offset="100%" stop-color="#3f2f9c"/>
    </radialGradient>
    <radialGradient id="sph-violet-lg-1" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="34%" stop-color="#b6a8ff"/>
      <stop offset="76%" stop-color="#6a4fd8"/>
      <stop offset="100%" stop-color="#3f2f9c"/>
    </radialGradient>
    <radialGradient id="sph-violet-lg-2" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="34%" stop-color="#b6a8ff"/>
      <stop offset="76%" stop-color="#6a4fd8"/>
      <stop offset="100%" stop-color="#3f2f9c"/>
    </radialGradient>
  </defs>

  <!-- Woody stem arcing in from the upper left, the way a sprig hangs -->
  <path d="M14 10 C 30 16, 40 24, 48 36" fill="none" stroke="#7a68d8"
        stroke-width="4" stroke-linecap="round"/>
  <path d="M30 18 C 36 24, 40 28, 42 34" fill="none" stroke="#7a68d8"
        stroke-width="3" stroke-linecap="round" opacity="0.75"/>

  <!-- Broad oval leaves with a centre vein -->
  <g fill="url(#lg-violet-leaf)">
    <path d="M12 30 C 12 18, 24 10, 38 13 C 40 26, 30 36, 15 35 Z"/>
    <path d="M56 12 C 68 4, 84 8, 88 20 C 78 30, 62 28, 56 16 Z"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.2" opacity="0.4" fill="none" stroke-linecap="round">
    <path d="M14 33 C 22 28, 30 22, 37 14"/>
    <path d="M58 14 C 66 16, 76 20, 86 20"/>
  </g>

  
    <g>
      <circle cx="34" cy="52" r="15" fill="url(#sph-violet-lg-0)"/>
      <ellipse cx="29.50" cy="46.60"
               rx="3.90" ry="2.85"
               fill="#ffffff" opacity="0.85"
               transform="rotate(-28 29.50 46.60)"/>
    </g>
    <g>
      <circle cx="68" cy="50" r="15" fill="url(#sph-violet-lg-1)"/>
      <ellipse cx="63.50" cy="44.60"
               rx="3.90" ry="2.85"
               fill="#ffffff" opacity="0.85"
               transform="rotate(-28 63.50 44.60)"/>
    </g>
    <g>
      <circle cx="50" cy="72" r="18" fill="url(#sph-violet-lg-2)"/>
      <ellipse cx="44.60" cy="65.52"
               rx="4.68" ry="3.42"
               fill="#ffffff" opacity="0.85"
               transform="rotate(-28 44.60 65.52)"/>
    </g>

  <!-- Calyx dimple: the small five-point crown at a lingonberry's base -->
  <g fill="#3f2f9c" opacity="0.5">
    <circle cx="50" cy="88" r="3.4"/>
  </g>
</svg>
