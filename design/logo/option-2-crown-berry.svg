<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Kingsberry crown berry mark">
  <defs>
    <linearGradient id="cb-body" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#8ea9ff"/>
      <stop offset="50%" stop-color="#4f6bff"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="cb-crown" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c451"/>
      <stop offset="100%" stop-color="#ffe9a8"/>
    </linearGradient>
  </defs>

  <!-- Crown: the "King" half of the name, sized to read at favicon scale -->
  <path
    d="M24 52 L28 27 L38 38 L50 19 L62 38 L72 27 L76 52 Z"
    fill="url(#cb-crown)"
  />
  <g fill="#ffffff" opacity="0.9">
    <circle cx="28" cy="24" r="3.2"/>
    <circle cx="50" cy="16" r="3.6"/>
    <circle cx="72" cy="24" r="3.2"/>
  </g>

  <!-- Two bold rows keep the berry legible when the crown sits above it -->
  <g fill="url(#cb-body)">
    <circle cx="20" cy="63" r="10"/>
    <circle cx="40" cy="63" r="10"/>
    <circle cx="60" cy="63" r="10"/>
    <circle cx="80" cy="63" r="10"/>
    <circle cx="31" cy="80" r="9"/>
    <circle cx="50" cy="80" r="9"/>
    <circle cx="69" cy="80" r="9"/>
  </g>

  <g fill="#ffffff" opacity="0.28">
    <circle cx="16.5" cy="59" r="3"/>
    <circle cx="36.5" cy="59" r="3"/>
    <circle cx="56.5" cy="59" r="3"/>
    <circle cx="28" cy="76.5" r="2.6"/>
  </g>
</svg>
