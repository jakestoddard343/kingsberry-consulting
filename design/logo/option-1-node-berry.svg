<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Kingsberry node berry mark">
  <defs>
    <linearGradient id="nb-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ea9ff"/>
      <stop offset="52%" stop-color="#4f6bff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="nb-leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34e5b0"/>
    </linearGradient>
  </defs>

  <!-- Leaves -->
  <g fill="url(#nb-leaf)">
    <path d="M50 42 C 56 31, 67 24, 78 20 C 76 32, 65 40, 50 42 Z"/>
    <path d="M50 42 C 44 31, 33 24, 22 20 C 24 32, 35 40, 50 42 Z"/>
    <path d="M50 41 C 45 32, 45 21, 50 12 C 55 21, 55 32, 50 41 Z" opacity="0.85"/>
  </g>

  <!--
    The drupelets sit a few units apart so the links between them stay visible.
    Packed tight, the edges disappear behind the nodes and the graph reading is
    lost — the gap is what makes this a network and not just a cluster.
  -->
  <g stroke="#8ea9ff" stroke-width="2.2" stroke-linecap="round" opacity="0.5">
    <path d="M20 50 H80"/>
    <path d="M30 67 H70"/>
    <path d="M40 84 H60"/>
    <path d="M20 50 L30 67 M40 50 L30 67 M40 50 L50 67 M60 50 L50 67 M60 50 L70 67 M80 50 L70 67"/>
    <path d="M30 67 L40 84 M50 67 L40 84 M50 67 L60 84 M70 67 L60 84"/>
  </g>

  <g fill="url(#nb-body)">
    <circle cx="20" cy="50" r="8"/>
    <circle cx="40" cy="50" r="8"/>
    <circle cx="60" cy="50" r="8"/>
    <circle cx="80" cy="50" r="8"/>
    <circle cx="30" cy="67" r="8"/>
    <circle cx="50" cy="67" r="8"/>
    <circle cx="70" cy="67" r="8"/>
    <circle cx="40" cy="84" r="7.5"/>
    <circle cx="60" cy="84" r="7.5"/>
  </g>

  <!-- Two live nodes, so the cluster reads as a running system -->
  <circle cx="60" cy="50" r="8" fill="#34e5b0"/>
  <circle cx="40" cy="84" r="7.5" fill="#22d3ee"/>

  <g fill="#ffffff" opacity="0.32">
    <circle cx="17" cy="46.5" r="2.4"/>
    <circle cx="37" cy="46.5" r="2.4"/>
    <circle cx="27" cy="63.5" r="2.2"/>
  </g>
</svg>
